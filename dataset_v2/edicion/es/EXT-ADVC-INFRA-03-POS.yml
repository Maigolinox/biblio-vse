services:
  web:
    image: registry.interno/biblio:2.1.0
    command: gunicorn config.wsgi --bind 0.0.0.0:8000
    networks:
      - red_aplicacion
    expose:
      - "8000"

  proxy:
    image: nginx:1.27
    ports:
      - "10.20.0.15:443:443"
    networks:
      - red_aplicacion

  db:
    image: postgres:15
    networks:
      - red_datos

networks:
  red_aplicacion:
    ipam:
      config:
        - subnet: 172.28.10.0/24
  red_datos:
    internal: true
